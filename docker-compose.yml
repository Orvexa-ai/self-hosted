# Sweeper Self-Hosted -- docker-compose.yml
# Full documentation: https://enterprise.sweeper-acct.com.au
#
# Prerequisites:
#   - Docker Engine 24+ and Docker Compose v2
#   - A Supabase project with combined_schema.sql applied
#   - A Sweeper MCP API key from enterprise.sweeper-acct.com.au
#
# Quick start:
#   cp .env.example .env          # fill in all required values
#   docker compose pull           # pull pre-built images
#   docker compose up -d
#   docker compose logs -f        # watch startup
#
# Upgrading:
#   Set SWEEPER_VERSION=x.y.z in .env, then:
#   docker compose pull
#   docker compose up -d

services:

  # --- Frontend ---
  # Pre-built image from Docker Hub. Supabase URL and API endpoint are injected
  # at container start -- no local build required.
  # AI processing is handled by Sweeper's backend via your MCP API key.
  frontend:
    image: sweeper425/sweeper-frontend:${SWEEPER_VERSION:-1.1.99}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    environment:
      VITE_SUPABASE_URL:      ${VITE_SUPABASE_URL}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
      SWEEPER_MCP_KEY:        ${SWEEPER_MCP_KEY}
      VITE_MCP_KEY:           ${SWEEPER_MCP_KEY}
      VITE_MCP_ENDPOINT:      ${SWEEPER_MCP_ENDPOINT:-https://sweeper-production-c279.up.railway.app}
      VITE_APP_NAME:          ${VITE_APP_NAME:-Sweeper}
      VITE_CONTACT_EMAIL:     ${VITE_CONTACT_EMAIL:-service@sweeper-acct.com.au}
      VITE_DEPLOYMENT_MODE:   self-hosted
